<!DOCTYPE html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #222">
    <h2>Hi, {{ username }}!</h2>
    <p>We received a request to reset your password. The link is valid for a limited time and can be used only once:</p>
    <p>
      <a href="{{ host }}api/auth/reset_password/{{ token }}"
         style="background:#2563eb;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none">
        Set a new password
      </a>
    </p>
    <p>If you did not request a password reset, ignore this message — your password stays the same.</p>
  </body>
</html>
